<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0705" />
  <title>La Cale Sèche — Blind Test</title>
  <style>
    :root{
      --bg:#080604;--panel:#160d08;--panel2:#221108;--line:#6b3518;
      --orange:#f08a24;--orange2:#ffac4a;--cream:#f2dfc4;--muted:#b99d7f;
      --green:#65d06e;--shadow:0 18px 55px rgba(0,0,0,.45)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at 50% -20%,rgba(240,138,36,.18),transparent 40%),
      linear-gradient(180deg,#0d0805 0%,var(--bg) 52%,#050403 100%);color:var(--cream);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:22px 16px 38px}
    .wrap{width:min(760px,100%);margin:0 auto}
    .brand{text-align:center;margin:8px 0 22px}
    .brand h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,8vw,72px);margin:0;letter-spacing:.02em;text-shadow:0 2px 0 #6f2e13,0 7px 18px rgba(0,0,0,.6)}
    .anchor{font-size:34px;line-height:1;margin:4px 0 8px;color:#c7b39a}
    .subtitle{margin:0;color:var(--muted);font-size:17px}
    .card{background:linear-gradient(180deg,rgba(34,17,8,.97),rgba(17,10,6,.97));border:1px solid rgba(240,138,36,.28);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
    .eyebrow{display:inline-flex;border:1px solid rgba(240,138,36,.55);color:var(--orange2);border-radius:999px;padding:7px 12px;font-weight:800;letter-spacing:.16em;font-size:12px;text-transform:uppercase;margin-bottom:13px}
    .status{font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,6vw,46px);margin:0 0 8px;line-height:1.05}
    .event-name{font-weight:800;font-size:19px;color:#f7e7d1;margin:6px 0 2px}
    .muted{color:var(--muted)}
    .nextbox{margin-top:18px;border:1px solid rgba(240,138,36,.35);background:#0e0906;border-radius:18px;padding:18px}
    .time{font-size:42px;font-weight:900;color:var(--orange2);letter-spacing:-.03em}
    .game-title{font-size:22px;font-weight:850;margin-top:3px}
    .countdown{margin-top:10px;font-variant-numeric:tabular-nums;color:#f3c38c;font-size:16px;font-weight:750}
    .schedule{display:grid;gap:10px;margin-top:14px}
    .game{display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center;padding:13px 14px;border:1px solid rgba(240,138,36,.18);border-radius:14px;background:rgba(0,0,0,.18)}
    .game .gt{font-weight:900;color:#f0c18c}
    .game .gn{font-weight:720}
    .game.past{opacity:.48}
    .game.current{border-color:rgba(101,208,110,.55);box-shadow:inset 0 0 0 1px rgba(101,208,110,.15)}
    .game.next{border-color:rgba(240,138,36,.55)}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;margin-right:8px;box-shadow:0 0 14px rgba(101,208,110,.45)}
    .empty{text-align:center;padding:30px 10px;color:var(--muted)}
    .error{color:#ffb3a7;background:rgba(120,20,10,.18);border:1px solid rgba(255,100,80,.25);padding:12px 14px;border-radius:12px;margin-top:12px}
    .footer{text-align:center;color:#7d6957;font-size:12px;padding:8px}
    button{appearance:none;border:1px solid rgba(240,138,36,.45);background:#160d08;color:var(--cream);border-radius:12px;padding:10px 14px;font-weight:800}
    .crew-card{margin-top:16px;border-top:1px solid rgba(240,138,36,.22);padding-top:18px}
    .crew-title{font-family:Georgia,"Times New Roman",serif;font-size:28px;margin:0 0 6px}
    .crew-help{color:var(--muted);margin:0 0 14px;line-height:1.45}
    .crew-form{display:grid;grid-template-columns:1fr auto;gap:10px}
    .crew-input{width:100%;min-width:0;border:1px solid rgba(240,138,36,.42);background:#0c0806;color:var(--cream);border-radius:13px;padding:14px 15px;font:inherit;font-size:16px;outline:none}
    .crew-input:focus{border-color:var(--orange2);box-shadow:0 0 0 3px rgba(240,138,36,.12)}
    .crew-submit{background:linear-gradient(180deg,#ffab49,#e87b18);color:#1b0d05;border:0;padding:0 18px;font-size:15px}
    .crew-submit:disabled{opacity:.55}
    .crew-welcome{border:1px solid rgba(101,208,110,.32);background:rgba(101,208,110,.07);border-radius:16px;padding:15px}
    .crew-name{font-size:22px;font-weight:900;color:#f7e7d1;margin-top:3px}
    .crew-change{margin-top:12px;background:transparent}
    .crew-msg{margin-top:10px;color:#f3c38c;font-size:14px}
    .entry-box{margin-top:14px;border:1px solid rgba(240,138,36,.32);background:rgba(240,138,36,.06);border-radius:14px;padding:13px 14px}
    .entry-label{color:var(--muted);font-size:13px}
    .entry-game{font-weight:900;color:#f7e7d1;margin-top:3px}
    .entry-ok{color:#93dd98;font-size:13px;margin-top:5px}
    @media(max-width:520px){.crew-form{grid-template-columns:1fr}.crew-submit{padding:14px 18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <h1>LA CALE SÈCHE</h1>
      <div class="anchor">⚓</div>
      <p class="subtitle">Blind Test — Quartier des équipages</p>
    </header>

    <section class="card" id="mainCard">
      <span class="eyebrow">Programme du navire</span>
      <h2 class="status" id="statusTitle">Chargement…</h2>
      <div id="content"><div class="empty">On consulte la Capitainerie…</div></div>
    </section>

    <section class="card" id="crewCard" hidden>
      <span class="eyebrow">Ton équipage</span>
      <div id="crewArea"></div>
    </section>

    <section class="card" id="scheduleCard" hidden>
      <span class="eyebrow">Ce soir</span>
      <div class="schedule" id="schedule"></div>
    </section>

    <div class="footer">La Cale Sèche • Toulon</div>
  </main>

<script>
const SUPABASE_URL = 'https://pvvnmgmoivixwibttjtn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jlyb542r570zH95r-U8Jmw_4LQ6WWg0';

const el = id => document.getElementById(id);
let state = { event:null, games:[], crew:null, entry:null, targetGame:null };

function localISODate(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseGameDate(dateStr,timeStr){
  const t=String(timeStr).slice(0,5);
  return new Date(`${dateStr}T${t}:00`);
}
function fmtDate(dateStr){
  return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date(`${dateStr}T12:00:00`));
}
function fmtTime(t){ return String(t).slice(0,5); }
function fmtCountdown(ms){
  if(ms<=0) return 'Ça commence maintenant';
  const total=Math.floor(ms/1000), h=Math.floor(total/3600), min=Math.floor((total%3600)/60), s=total%60;
  if(h>0) return `Départ dans ${h} h ${String(min).padStart(2,'0')} min`;
  return `Départ dans ${min} min ${String(s).padStart(2,'0')} s`;
}


function crewStorageKey(eventId){ return `cale_seche_crew_${eventId}`; }
function readSavedCrew(eventId){
  try{
    const raw=localStorage.getItem(crewStorageKey(eventId));
    return raw ? JSON.parse(raw) : null;
  }catch(_){ return null; }
}
function saveCrew(eventId,crew){
  localStorage.setItem(crewStorageKey(eventId),JSON.stringify({id:crew.id,team_name:crew.team_name}));
}
function forgetCrew(eventId){
  localStorage.removeItem(crewStorageKey(eventId));
  state.crew=null;
  state.entry=null;
  state.targetGame=null;
  renderCrew();
}
async function verifySavedCrew(eventId){
  const saved=readSavedCrew(eventId);
  if(!saved?.id) return null;
  try{
    const rows=await api(`crews?select=id,event_id,team_name&id=eq.${saved.id}&event_id=eq.${eventId}&limit=1`);
    return rows[0] || null;
  }catch(_){ return null; }
}
async function createCrew(teamName){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/crews`,{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({event_id:state.event.id,team_name:teamName})
  });
  if(r.status===409) throw new Error('Ce nom d’équipage est déjà pris pour cette soirée.');
  if(!r.ok) throw new Error(`Impossible d’embarquer (${r.status}).`);
  const rows=await r.json();
  return rows[0];
}

function findTargetGame(){
  if(!state.event || !state.games.length) return null;
  const now=new Date();
  const gameDates=state.games.map(g=>({...g,date:parseGameDate(state.event.event_date,g.game_time)}));
  let current=null;
  for(const g of gameDates){
    if(now>=g.date && now<new Date(g.date.getTime()+20*60*1000)) current=g;
  }
  return current || gameDates.find(g=>g.date>now) || null;
}

async function getExistingEntry(gameId,crewId){
  const rows=await api(`game_entries?select=id,game_id,crew_id,score,joined_at&game_id=eq.${gameId}&crew_id=eq.${crewId}&limit=1`);
  return rows[0] || null;
}

async function createGameEntry(gameId,crewId){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/game_entries`,{
    method:'POST',
    headers:{
      'apikey':SUPABASE_KEY,
      'Content-Type':'application/json',
      'Prefer':'return=representation'
    },
    body:JSON.stringify({game_id:gameId,crew_id:crewId,score:0})
  });
  if(r.status===409) return await getExistingEntry(gameId,crewId);
  if(!r.ok) throw new Error(`Inscription à la game impossible (${r.status}).`);
  const rows=await r.json();
  return rows[0] || null;
}

async function ensureGameEntry(){
  state.targetGame=findTargetGame();
  if(!state.crew || !state.targetGame){
    state.entry=null;
    renderCrew();
    return;
  }
  try{
    let entry=await getExistingEntry(state.targetGame.id,state.crew.id);
    if(!entry) entry=await createGameEntry(state.targetGame.id,state.crew.id);
    state.entry=entry;
  }catch(err){
    console.error('Game entry failed',err);
    state.entry={error:err.message};
  }
  renderCrew();
}

function renderCrew(){
  if(!state.event) return;
  el('crewCard').hidden=false;
  const area=el('crewArea');
  if(state.crew){
    const entryHtml = state.targetGame
      ? `<div class="entry-box">
           <div class="entry-label">${state.targetGame.date <= new Date() ? 'Game en cours' : 'Prochaine game'}</div>
           <div class="entry-game">${fmtTime(state.targetGame.game_time)} — ${escapeHtml(state.targetGame.title)}</div>
           <div class="${state.entry?.error ? 'crew-msg' : 'entry-ok'}">${state.entry?.error ? '⚠️ '+escapeHtml(state.entry.error) : state.entry ? '✓ Équipage inscrit automatiquement' : 'Inscription en cours…'}</div>
         </div>`
      : `<div class="entry-box"><div class="entry-label">Aucune autre game ouverte ce soir.</div></div>`;
    area.innerHTML=`<div class="crew-welcome"><div class="muted">Tu joues avec</div><div class="crew-name">⚓ ${escapeHtml(state.crew.team_name)}</div><div class="crew-msg">Ce téléphone gardera cet équipage pour toute la soirée.</div>${entryHtml}<button class="crew-change" id="changeCrew" type="button">Changer d’équipage</button></div>`;
    el('changeCrew').onclick=()=>forgetCrew(state.event.id);
    return;
  }
  area.innerHTML=`<h3 class="crew-title">Crée ton équipage</h3><p class="crew-help">Un téléphone suffit par équipe. Choisis un nom, puis garde ce téléphone pour répondre pendant les blind tests.</p><form class="crew-form" id="crewForm"><input class="crew-input" id="crewName" maxlength="30" minlength="2" autocomplete="off" placeholder="Ex. Les Pirates du Rhum" required><button class="crew-submit" id="crewSubmit" type="submit">Embarquer</button></form><div class="crew-msg" id="crewMsg"></div>`;
  el('crewForm').onsubmit=async(e)=>{
    e.preventDefault();
    const name=el('crewName').value.trim().replace(/\s+/g,' ');
    const msg=el('crewMsg');
    if(name.length<2){ msg.textContent='Choisis un nom d’au moins 2 caractères.'; return; }
    el('crewSubmit').disabled=true; msg.textContent='On inscrit l’équipage…';
    try{
      const crew=await createCrew(name);
      state.crew=crew; saveCrew(state.event.id,crew); renderCrew(); await ensureGameEntry();
    }catch(err){ msg.textContent=err.message; el('crewSubmit').disabled=false; }
  };
}
function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

async function api(path){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    headers:{'apikey':SUPABASE_KEY}
  });
  if(!r.ok) throw new Error(`Supabase ${r.status}`);
  return r.json();
}

async function load(){
  try{
    const today=localISODate();
    const events=await api(`events?select=id,name,event_date,response_seconds,auto_mode,status&status=eq.scheduled&event_date=gte.${today}&order=event_date.asc,id.desc&limit=1`);
    if(!events.length){
      el('statusTitle').textContent='Aucun blind test programmé';
      el('content').innerHTML='<div class="empty">La Capitainerie n\'a encore rien annoncé. Reviens un peu plus tard, moussaillon. 🏴‍☠️</div>';
      return;
    }
    state.event=events[0];
    state.games=await api(`games?select=id,event_id,game_time,title,game_order,status&event_id=eq.${state.event.id}&order=game_order.asc`);
    state.crew=await verifySavedCrew(state.event.id);
    render();
    renderCrew();
    if(state.crew) await ensureGameEntry();
    setInterval(()=>{
      render();
      const target=findTargetGame();
      if(state.crew && target && target.id !== state.targetGame?.id) ensureGameEntry();
    },1000);
  }catch(err){
    el('statusTitle').textContent='Capitainerie indisponible';
    el('content').innerHTML=`<div class="error">Impossible de lire le programme pour le moment. ${err.message}</div>`;
  }
}

function render(){
  const ev=state.event, games=state.games;
  if(!ev) return;
  const now=new Date();
  const eventDay=ev.event_date;
  const today=localISODate(now);
  const gameDates=games.map(g=>({...g,date:parseGameDate(eventDay,g.game_time)}));
  const durationMs=(ev.response_seconds||15)*1000; // simple marker, real game duration comes later

  let next=gameDates.find(g=>g.date>now);
  let current=null;
  // Temporary 20-minute active window so the status can show "en cours" during prototype tests.
  for(const g of gameDates){
    if(now>=g.date && now<new Date(g.date.getTime()+20*60*1000)) current=g;
  }

  el('scheduleCard').hidden=false;
  const schedule=el('schedule');
  schedule.innerHTML=gameDates.map(g=>{
    let cls='';
    if(current && g.id===current.id) cls='current';
    else if(next && g.id===next.id) cls='next';
    else if(g.date<now) cls='past';
    return `<div class="game ${cls}"><div class="gt">${fmtTime(g.game_time)}</div><div class="gn">${g.title}</div></div>`;
  }).join('');

  if(eventDay>today){
    el('statusTitle').textContent='Prochaine soirée';
    el('content').innerHTML=`<div class="event-name">${ev.name}</div><div class="muted">${fmtDate(eventDay)}</div>${gameDates[0]?`<div class="nextbox"><div class="muted">Premier départ</div><div class="time">${fmtTime(gameDates[0].game_time)}</div><div class="game-title">${gameDates[0].title}</div></div>`:''}`;
    return;
  }

  if(current){
    el('statusTitle').innerHTML='<span class="dot"></span>Blind Test en cours';
    el('content').innerHTML=`<div class="event-name">${ev.name}</div><div class="nextbox"><div class="time">${fmtTime(current.game_time)}</div><div class="game-title">${current.title}</div><div class="muted" style="margin-top:9px">Rejoins ton équipage. Le jeu joueur arrivera à l’étape suivante.</div></div>`;
  }else if(next){
    el('statusTitle').textContent='Prochain Blind Test';
    el('content').innerHTML=`<div class="event-name">${ev.name}</div><div class="muted">${fmtDate(eventDay)}</div><div class="nextbox"><div class="time">${fmtTime(next.game_time)}</div><div class="game-title">${next.title}</div><div class="countdown">${fmtCountdown(next.date-now)}</div></div>`;
  }else{
    el('statusTitle').textContent='Soirée terminée';
    el('content').innerHTML=`<div class="event-name">${ev.name}</div><div class="empty">Les jeux prévus sont terminés pour ce soir. 🍻</div>`;
  }
}

load();
</script>
</body>
</html>
